name: Stellar
version: "0.2.0"
tagline: Dein selbst gehostetes Second Brain – Wiki, Tagesnotizen, Inbox, Projekte
icon: https://raw.githubusercontent.com/Hobix0/Stellar/main/hobix-stellar/icon.svg
description: >-
  Stellar ist ein persönliches Second Brain im Notion-Stil.


  Wiki: verschachtelte Seiten mit Block-Editor (Slash-Menü, Markdown-Kürzel,
  Aufgaben, Hinweise, Code), Verlinkungen zwischen Seiten mit [[…]],
  Rückverweise, Favoriten, Volltextsuche und Papierkorb.


  Tagesnotizen mit Kalender und Inbox zum schnellen Festhalten (Alt + N),
  einsortierbar in die Tagesnotiz, auf eine Seite oder als Aufgabe.


  Projekte: Board und Liste, Aufgaben mit Status, Priorität, Fälligkeit,
  Labels, Checklisten und Verknüpfung zu Wiki-Seiten.


  Erinnerungen mit Wiederholung und Push aufs Handy über Home Assistant,
  Morgen-Briefing und ein MCP-Server, über den Sprachassistenten und
  Claude dein Second Brain lesen und beschreiben können.


  Die Daten liegen in einer eigenen PostgreSQL-Datenbank auf deinem Umbrel.
  Der Zugang ist über die Umbrel-Anmeldung geschützt.
